<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ăn tré hong ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2742;--bg:#eef1f5;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;--ok:#059669;--warn:#d97706;--bad:#e11d48;--card:#fff;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit}
.shell{display:flex;min-height:100vh}
.side{width:230px;flex-shrink:0;background:var(--navy);color:#cbd5e1;padding:8px 0;overflow-y:auto}
.side h1{color:#fff;font-size:17px;margin:10px 16px 14px}
.side button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 16px;cursor:pointer}
.side button:hover{background:rgba(255,255,255,.08)}.side button.on{background:#059669;color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .sp{flex:1}
.content{padding:14px;flex:1}
h2{margin:0 0 12px;font-size:19px}h3{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.btn{background:var(--ok);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{filter:brightness(.95)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #cbd5e1}.btn.red{background:var(--bad)}.btn.amber{background:var(--warn)}.btn.sm{padding:4px 9px;font-size:12px}
input,select{border:1px solid #cbd5e1;border-radius:7px;padding:8px 10px;background:#fff;color:var(--ink);max-width:100%}
label{display:block;margin-bottom:10px;color:var(--mut);font-size:13px}label input,label select{display:block;width:100%;margin-top:4px;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.end{justify-content:flex-end}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-weight:500;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px 8px 0;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.badge{display:inline-block;padding:1px 8px;border-radius:5px;font-size:12px;white-space:nowrap}
.b-ok{background:#d1fae5;color:#065f46}.b-warn{background:#fef3c7;color:#92400e}.b-bad{background:#ffe4e6;color:#9f1239}.b-mut{background:#f1f5f9;color:#475569}.b-info{background:#e0f2fe;color:#075985}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.kpi b{display:block;font-size:20px;margin-top:2px}.kpi span{color:var(--mut);font-size:12px}
.pos{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;cursor:pointer;min-height:92px}
.tile:hover{border-color:var(--ok)}.tile:disabled{opacity:.45;cursor:not-allowed}.tile b{display:block;margin-bottom:4px}.tile span{color:var(--mut);font-size:12px}
.cart .ln{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #f1f5f9}
.cart .total{font-size:22px;font-weight:700;margin:8px 0}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:28px;height:28px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;cursor:pointer}
.warn{background:#fef3c7;color:#92400e;border-radius:8px;padding:10px 12px;margin-bottom:12px}
.empty{color:var(--mut);padding:24px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.box{background:#fff;border-radius:10px;padding:18px;width:100%;max-width:440px;max-height:100%;overflow:auto}
#toast{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:70;display:flex;flex-direction:column;gap:6px}
.t{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;max-width:320px;box-shadow:0 2px 8px rgba(0,0,0,.25)}.t.bad{background:var(--bad)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:14px}
.login form{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:360px}
.menu{display:none}
@media(max-width:820px){
 .side{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}
 .menu{display:inline-block}.pos{grid-template-columns:1fr}
}
</style></head>
<body><div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============ CẤU HÌNH ============ */
const SB_URL = 'https://fouukklbtrrbrdzmlkfd.supabase.co';
const SB_KEY = 'sb_publishable__RArgZFOUSNg-OuF90VbIw_spkX93G2';   // khóa công khai; quyền thật nằm ở cơ sở dữ liệu
const sb = supabase.createClient(SB_URL, SB_KEY);

/* ============ TIỆN ÍCH ============ */
const h = (t, a, ...c) => {
  const e = document.createElement(t); let val;
  for (const [k, v] of Object.entries(a || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'value') val = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  c.flat(9).forEach(x => { if (x == null || x === false) return; e.append(x.nodeType ? x : document.createTextNode(String(x))); });
  if (val !== undefined) e.value = val;
  return e;
};
const fm = n => Math.round(+n || 0).toLocaleString('vi-VN') + 'đ';
const vnDate = (d = new Date()) => new Date(d).toLocaleDateString('en-CA', { timeZone: 'Asia/Ho_Chi_Minh' });
const addDays = n => vnDate(new Date(Date.now() + n * 864e5));
const vnTime = t => t ? new Date(t).toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour12: false }) : '';
const badge = (t, k = 'mut') => h('span', { class: 'badge b-' + k }, t);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random());
const ROLE_VI = { ADMIN: 'Quản trị', OPERATIONS_MANAGER: 'Quản lý vận hành', SALES_MANAGER: 'Quản lý kinh doanh', SALES: 'Kinh doanh', PRODUCTION: 'Sản xuất', WAREHOUSE: 'Kho', QC: 'QC', FINANCE: 'Tài chính', OUTLET_MANAGER: 'Quản lý điểm bán', OUTLET_STAFF: 'Nhân viên điểm bán' };
const q = async p => { const { data, error } = await p; if (error) throw error; return data; };
const rpc = (n, a) => q(sb.rpc(n, a));
const toast = (m, bad) => { const t = h('div', { class: 't' + (bad ? ' bad' : '') }, m); $('#toast').append(t); setTimeout(() => t.remove(), bad ? 6000 : 3500); };
const fail = e => { console.error(e); toast((e && e.message) || String(e), true); };
const $ = (s, r = document) => r.querySelector(s);
const table = (cols, rows) => h('div', { class: 'sc' }, h('table', {}, h('thead', {}, h('tr', {}, cols.map(c => h('th', {}, c)))),
  h('tbody', {}, rows.length ? rows.map(r => h('tr', {}, r.map(c => h('td', {}, c)))) : h('tr', {}, h('td', { colspan: cols.length, class: 'empty' }, 'Chưa có dữ liệu')))));

function dialog(title, fields, okText = 'Lưu') {
  return new Promise(res => {
    const inputs = fields.map(f => {
      const el = f.opts ? h('select', {}, f.opts.map(o => h('option', { value: o[0] }, o[1]))) : h('input', { type: f.type || 'text', placeholder: f.ph || '', value: f.val ?? '', step: f.type === 'number' ? 'any' : null });
      if (f.opts && f.val != null) el.value = f.val;
      return [f, el];
    });
    const close = v => { m.remove(); res(v); };
    const m = h('div', { class: 'modal', onclick: e => { if (e.target === m) close(null); } },
      h('div', { class: 'box' }, h('h3', {}, title), inputs.map(([f, el]) => h('label', {}, f.l, el)),
        h('div', { class: 'row end' }, h('button', { class: 'btn ghost', onclick: () => close(null) }, 'Hủy'),
          h('button', { class: 'btn', onclick: () => { const o = {}; inputs.forEach(([f, el]) => o[f.k] = f.type === 'number' ? (el.value === '' ? null : +el.value) : el.value.trim ? el.value.trim() : el.value); close(o); } }, okText))));
    document.body.append(m); const first = m.querySelector('input,select'); if (first) first.focus();
  });
}
const confirmBox = msg => new Promise(res => {
  const close = v => { m.remove(); res(v); };
  const m = h('div', { class: 'modal' }, h('div', { class: 'box' }, h('p', {}, msg), h('div', { class: 'row end' },
    h('button', { class: 'btn ghost', onclick: () => close(false) }, 'Hủy'), h('button', { class: 'btn', onclick: () => close(true) }, 'Đồng ý'))));
  document.body.append(m);
});

/* ============ TRẠNG THÁI & QUYỀN ============ */
const S = { prof: null, outlets: [], mine: [], oid: null, mod: null, products: [], notifs: [] };
const role = () => S.prof.role;
const is = (...r) => r.includes(role());
const stores = () => S.outlets.filter(o => o.kind === 'store');
const oname = id => (S.outlets.find(o => o.id === id) || {}).name || '—';
const pname = id => (S.products.find(p => p.id === id) || {}).name || id;
const MODS = [
  ['dash',  'Theo dõi điểm bán',  ['ADMIN', 'OPERATIONS_MANAGER', 'SALES_MANAGER', 'FINANCE', 'OUTLET_MANAGER']],
  ['pos',   'Bán hàng',           ['ADMIN', 'OPERATIONS_MANAGER', 'OUTLET_MANAGER', 'OUTLET_STAFF']],
  ['sales', 'Hóa đơn bán lẻ',     ['ADMIN', 'OPERATIONS_MANAGER', 'SALES_MANAGER', 'FINANCE', 'OUTLET_MANAGER', 'OUTLET_STAFF']],
  ['shift', 'Ca bán & chốt ca',   ['ADMIN', 'OPERATIONS_MANAGER', 'OUTLET_MANAGER', 'OUTLET_STAFF']],
  ['stock', 'Tồn kho & FEFO',     ['ADMIN', 'OPERATIONS_MANAGER', 'PRODUCTION', 'WAREHOUSE', 'QC', 'OUTLET_MANAGER', 'OUTLET_STAFF']],
  ['recv',  'Chuyển & nhận kho',  ['ADMIN', 'OPERATIONS_MANAGER', 'WAREHOUSE', 'OUTLET_MANAGER', 'OUTLET_STAFF']],
  ['batch', 'Sản xuất & QC',      ['ADMIN', 'OPERATIONS_MANAGER', 'PRODUCTION', 'QC']],
  ['orders','Đơn hàng B2B',       ['ADMIN', 'OPERATIONS_MANAGER', 'SALES_MANAGER', 'SALES', 'PRODUCTION', 'WAREHOUSE', 'QC', 'FINANCE']],
  ['cust',  'Khách hàng & công nợ', ['ADMIN', 'OPERATIONS_MANAGER', 'SALES_MANAGER', 'SALES', 'FINANCE']],
  ['audit', 'Nhật ký thao tác',   ['ADMIN']]
];
const allowed = () => MODS.filter(m => m[2].includes(role()));
const needsOutlet = m => ['pos', 'shift', 'recv'].includes(m);

/* ============ KHUNG ỨNG DỤNG ============ */
const app = $('#app');
function loginView(msg) {
  let show = false;
  const em = h('input', { type: 'email', autocomplete: 'username', placeholder: 'email@antrehong.vn' });
  const pw = h('input', { type: 'password', autocomplete: 'current-password' });
  const err = h('div', { style: 'color:var(--bad);margin:8px 0' }, msg || '');
  const btn = h('button', { class: 'btn', style: 'width:100%' }, 'Đăng nhập');
  const f = h('form', { onsubmit: async e => {
    e.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Đang đăng nhập…';
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    btn.disabled = false; btn.textContent = 'Đăng nhập';
    if (error) err.textContent = error.message === 'Invalid login credentials' ? 'Sai email hoặc mật khẩu.' : error.message;
  } },
    h('h2', {}, 'Ăn tré hong ERP'), h('div', { style: 'color:var(--mut);margin:-6px 0 14px' }, 'Đăng nhập bằng tài khoản được cấp'),
    h('label', {}, 'Email', em),
    h('label', {}, 'Mật khẩu', h('div', { class: 'row', style: 'flex-wrap:nowrap' }, pw,
      h('button', { type: 'button', class: 'btn ghost sm', onclick: () => { show = !show; pw.type = show ? 'text' : 'password'; } }, 'Hiện/Ẩn'))),
    err, btn,
    h('div', { style: 'margin-top:10px;text-align:center' }, h('a', { href: '#', onclick: async e => {
      e.preventDefault(); if (!em.value) { err.textContent = 'Nhập email trước.'; return; }
      const { error } = await sb.auth.resetPasswordForEmail(em.value.trim(), { redirectTo: location.href.split('#')[0] });
      err.style.color = error ? 'var(--bad)' : 'var(--ok)'; err.textContent = error ? error.message : 'Đã gửi email đặt lại mật khẩu (nếu tài khoản tồn tại).';
    } }, 'Quên mật khẩu?')));
  app.replaceChildren(h('div', { class: 'login' }, f));
}

async function boot(user) {
  try {
    const prof = await q(sb.from('profiles').select('*').eq('id', user.id).maybeSingle());
    if (!prof || prof.status !== 'Active') { await sb.auth.signOut(); return loginView('Tài khoản chưa được kích hoạt hoặc đã bị khóa.'); }
    S.prof = prof;
    const [outs, mine, prods] = await Promise.all([
      q(sb.from('outlets').select('*').order('code')), q(sb.from('user_outlets').select('outlet_id')),
      q(sb.from('products').select('id,name,retail_price,active').order('id'))]);
    S.outlets = outs; S.mine = mine.map(x => x.outlet_id); S.products = prods;
    const st = stores(); S.oid = (st.find(o => S.mine.includes(o.id)) || st[0] || {}).id || null;
    S.mod = (allowed()[0] || [])[0] || null;
    await loadNotifs(); shell(); subscribe(); go(S.mod);
  } catch (e) { fail(e); loginView('Không tải được dữ liệu: ' + e.message); }
}

function shell() {
  const side = h('div', { class: 'side' }, h('h1', {}, 'Ăn tré hong ERP'),
    allowed().map(m => h('button', { 'data-m': m[0], onclick: () => { side.classList.remove('open'); go(m[0]); } }, m[1])));
  const sel = h('select', { id: 'osel', onchange: e => { S.oid = e.target.value; go(S.mod); } },
    S.outlets.filter(o => o.kind === 'store' || is('ADMIN', 'OPERATIONS_MANAGER', 'WAREHOUSE', 'PRODUCTION', 'QC')).map(o => h('option', { value: o.id }, o.name)));
  if (S.oid) sel.value = S.oid;
  const bell = h('button', { class: 'btn ghost', id: 'bell', onclick: showNotifs }, 'Thông báo');
  const top = h('div', { class: 'top' },
    h('button', { class: 'btn ghost menu', onclick: () => side.classList.toggle('open') }, '☰'),
    h('b', { id: 'crumb' }, ''), h('div', { class: 'sp' }), S.outlets.length > 1 || stores().length ? sel : null, bell,
    h('span', { style: 'color:var(--mut)' }, S.prof.full_name || S.prof.email, ' · ', ROLE_VI[role()]),
    h('button', { class: 'btn ghost sm', onclick: changePw }, 'Đổi mật khẩu'),
    h('button', { class: 'btn ghost sm', onclick: () => sb.auth.signOut() }, 'Thoát'));
  app.replaceChildren(h('div', { class: 'shell' }, side, h('div', { class: 'main' }, top, h('div', { class: 'content', id: 'view' }))));
}
async function changePw() {
  const v = await dialog('Đổi mật khẩu', [{ k: 'p', l: 'Mật khẩu mới (tối thiểu 8 ký tự)', type: 'password' }]);
  if (!v) return; if ((v.p || '').length < 8) return toast('Mật khẩu tối thiểu 8 ký tự', true);
  const { error } = await sb.auth.updateUser({ password: v.p }); error ? fail(error) : toast('Đã đổi mật khẩu');
}
let seq = 0;
async function go(mod, quiet) {
  if (!mod) return $('#view').replaceChildren(h('div', { class: 'empty' }, 'Tài khoản chưa được cấp quyền vào chức năng nào. Liên hệ quản trị.'));
  S.mod = mod; const my = ++seq; const m = MODS.find(x => x[0] === mod);
  document.querySelectorAll('.side button').forEach(b => b.classList.toggle('on', b.dataset.m === mod));
  $('#crumb').textContent = m[1];
  const sel = $('#osel'); if (sel) sel.style.display = ['dash', 'orders', 'cust', 'batch', 'audit'].includes(mod) ? 'none' : '';
  const view = $('#view'); if (!quiet) view.replaceChildren(h('div', { class: 'empty' }, 'Đang tải…'));
  try { const node = await VIEWS[mod](); if (my === seq) view.replaceChildren(node); } catch (e) { fail(e); if (my === seq && !quiet) view.replaceChildren(h('div', { class: 'empty' }, 'Không tải được: ' + e.message)); }
}
const refresh = () => { if (!S.prof || document.querySelector('.modal') || S.mod === 'pos') return; const a = document.activeElement; if (a && ['INPUT', 'SELECT'].includes(a.tagName)) return; go(S.mod, true); };

/* ============ THÔNG BÁO & REALTIME ============ */
async function loadNotifs() {
  try { S.notifs = await q(sb.from('notifications').select('id,created_at,message').order('id', { ascending: false }).limit(30)); } catch (e) { S.notifs = []; }
  const seen = +localStorage.getItem('nseen') || 0, n = S.notifs.filter(x => x.id > seen).length, b = $('#bell');
  if (b) b.textContent = 'Thông báo' + (n ? ' (' + n + ')' : '');
}
function showNotifs() {
  if (S.notifs[0]) localStorage.setItem('nseen', S.notifs[0].id);
  const m = h('div', { class: 'modal', onclick: e => { if (e.target === m) { m.remove(); loadNotifs(); } } }, h('div', { class: 'box' }, h('h3', {}, 'Thông báo'),
    S.notifs.length ? S.notifs.map(n => h('div', { style: 'padding:7px 0;border-bottom:1px solid var(--line)' }, n.message, h('div', { style: 'color:var(--mut);font-size:12px' }, vnTime(n.created_at)))) : h('div', { class: 'empty' }, 'Không có thông báo'),
    h('div', { class: 'row end', style: 'margin-top:10px' }, h('button', { class: 'btn ghost', onclick: () => { m.remove(); loadNotifs(); } }, 'Đóng'))));
  document.body.append(m);
}
let chan = null;
function subscribe() {
  if (chan) sb.removeChannel(chan); let t;
  chan = sb.channel('live');
  ['retail_sales', 'stock_movements', 'notifications', 'orders', 'shifts'].forEach(tb => chan.on('postgres_changes', { event: '*', schema: 'public', table: tb }, () => {
    clearTimeout(t); t = setTimeout(() => { refresh(); if (tb === 'notifications') loadNotifs(); }, 700);
  }));
  chan.subscribe();
}

/* ============ MÀN HÌNH ============ */
const needOutlet = () => h('div', { class: 'empty' }, 'Tài khoản chưa được gán điểm bán. Liên hệ quản trị để được gán.');
const sellable = rows => { const a = {}; rows.filter(x => x.qc_status === 'PASS' && !x.locked && x.expires_on >= vnDate()).forEach(x => a[x.product_id] = (a[x.product_id] || 0) + x.qty); return a; };

async function posView() {
  const o = S.oid; if (!o) return needOutlet();
  const [stock, shift] = await Promise.all([
    q(sb.from('stock_on_hand').select('product_id,qty,expires_on,qc_status,locked').eq('outlet_id', o)),
    q(sb.from('shifts').select('id').eq('outlet_id', o).is('closed_at', null).limit(1))]);
  const avail = sellable(stock), cart = {}; let pay = 'cash', disc = '', note = '', ref = uid(), busy = false;
  const root = h('div'), canDisc = !is('OUTLET_STAFF');
  const total = () => Object.entries(cart).reduce((s, [id, n]) => s + n * (S.products.find(p => p.id === id).retail_price), 0);
  const draw = () => {
    const sum = total(), d = Math.min(+disc || 0, sum);
    root.replaceChildren(h('div', {},
      !shift.length ? h('div', { class: 'warn' }, 'Chưa mở ca tại điểm bán này. Vào "Ca bán & chốt ca" để mở ca trước khi bán.') : null,
      h('div', { class: 'pos' },
        h('div', { class: 'tiles' }, S.products.filter(p => p.active).map(p => {
          const left = (avail[p.id] || 0) - (cart[p.id] || 0);
          return h('button', { class: 'tile', disabled: left <= 0 || !shift.length, onclick: () => { cart[p.id] = (cart[p.id] || 0) + 1; draw(); } },
            h('b', {}, p.name), h('div', {}, fm(p.retail_price)), h('span', {}, left > 0 ? 'Còn ' + left : 'Hết hàng'));
        })),
        h('div', { class: 'card cart' }, h('h3', {}, 'Giỏ hàng'),
          Object.keys(cart).length ? Object.entries(cart).map(([id, n]) => h('div', { class: 'ln' }, h('div', {}, pname(id), h('div', { style: 'color:var(--mut);font-size:12px' }, fm(S.products.find(p => p.id === id).retail_price))),

  const rows = await q(sb.from('customers').select('id,code,name,venue,stage,price_tier,pay_terms,salesperson,phone,customer_finance(credit_limit,balance)').order('name'));
  const fin = c => Array.isArray(c.customer_finance) ? c.customer_finance[0] : c.customer_finance;
  const canEdit = is('ADMIN', 'OPERATIONS_MANAGER', 'SALES_MANAGER', 'SALES'), canPay = is('ADMIN', 'OPERATIONS_MANAGER', 'FINANCE');
  const F = [{ k: 'name', l: 'Tên khách hàng' }, { k: 'venue', l: 'Loại hình', opts: ['Karaoke', 'Beer Club', 'Pub', 'Lounge', 'Bar', 'Restaurant', 'Café', 'Distributor', 'Event/Catering'].map(x => [x, x]) },
    { k: 'price_tier', l: 'Bảng giá', opts: [['Standard', 'Standard'], ['VIP', 'VIP']] }, { k: 'pay_terms', l: 'Thanh toán', opts: ['COD', 'NET15', 'NET30'].map(x => [x, x]) }, { k: 'salesperson', l: 'Sales phụ trách' }, { k: 'phone', l: 'Điện thoại' }];
  const edit = async c => { const v = await dialog(c ? 'Sửa khách hàng' : 'Thêm khách hàng', F.map(f => ({ ...f, val: c ? c[f.k] : undefined })), 'Lưu'); if (!v) return; if (!v.name) return toast('Nhập tên khách hàng', true);
    try { c ? await q(sb.from('customers').update(v).eq('id', c.id)) : await q(sb.from('customers').insert(v)); toast('Đã lưu'); go('cust'); } catch (e) { fail(e); } };
  return h('div', {}, canEdit ? h('div', { class: 'row', style: 'margin-bottom:10px' }, h('button', { class: 'btn', onclick: () => edit(null) }, '+ Khách hàng')) : null,
    h('div', { class: 'card' }, table(['Mã', 'Khách hàng', 'Loại hình', 'Bảng giá', 'Thanh toán', 'Hạn mức', 'Dư nợ', ''], rows.map(c => { const f = fin(c); return [c.code, h('b', {}, c.name), c.venue, c.price_tier, c.pay_terms, f ? fm(f.credit_limit) : '—',
      f ? h('span', { style: f.balance > f.credit_limit * .8 && f.credit_limit > 0 ? 'color:var(--bad);font-weight:600' : '' }, fm(f.balance)) : '—',
      h('div', { class: 'row' }, canEdit ? h('button', { class: 'btn ghost sm', onclick: () => edit(c) }, 'Sửa') : null,
        canPay && f && f.balance > 0 ? h('button', { class: 'btn sm', onclick: async () => { const v = await dialog('Ghi nhận thu tiền — ' + c.name, [{ k: 'a', l: 'Số tiền thu (đ)', type: 'number', val: f.balance }], 'Ghi nhận'); if (!v) return; try { await rpc('record_payment', { p_customer: c.id, p_amount: v.a }); toast('Đã ghi nhận'); go('cust'); } catch (e) { fail(e); } } }, 'Thu tiền') : null,
        is('ADMIN') && f ? h('button', { class: 'btn ghost sm', onclick: async () => { const v = await dialog('Hạn mức công nợ — ' + c.name, [{ k: 'l', l: 'Hạn mức (đ)', type: 'number', val: f.credit_limit }]); if (!v || v.l == null) return; try { await q(sb.from('customer_finance').update({ credit_limit: v.l }).eq('customer_id', c.id)); toast('Đã lưu'); go('cust'); } catch (e) { fail(e); } } }, 'Hạn mức') : null)]; }))));
}

async function auditView() {
  const rows = await q(sb.from('audit_log').select('*').order('id', { ascending: false }).limit(200));
  return h('div', { class: 'card' }, h('h3', {}, '200 thao tác gần nhất'), table(['Thời gian', 'Người dùng', 'Hành động', 'Bảng', 'Mã bản ghi', 'Thay đổi'], rows.map(a => {
    let ch = ''; if (a.action === 'UPDATE' && a.old_data && a.new_data) ch = Object.keys(a.new_data).filter(k => JSON.stringify(a.new_data[k]) !== JSON.stringify(a.old_data[k])).map(k => k + ': ' + JSON.stringify(a.old_data[k]) + ' → ' + JSON.stringify(a.new_data[k])).join('; ');
    return [vnTime(a.at), a.user_email || 'hệ thống', badge(a.action, a.action === 'DELETE' ? 'bad' : a.action === 'INSERT' ? 'ok' : 'warn'), a.table_name, (a.row_id || '').slice(0, 8), h('span', { style: 'font-size:12px' }, ch.slice(0, 220))];
  })));
}
const VIEWS = { dash: dashView, pos: posView, sales: salesView, shift: shiftView, stock: stockView, recv: recvView, batch: batchView, orders: ordersView, cust: custView, audit: auditView };

/* ============ KHỞI ĐỘNG ============ */
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'SIGNED_OUT' || !session) { S.prof = null; if (chan) { sb.removeChannel(chan); chan = null; } loginView(); }
  else if (ev === 'SIGNED_IN' && !(S.prof && S.prof.id === session.user.id)) setTimeout(() => boot(session.user), 0);
});
sb.auth.getSession().then(({ data }) => { if (!data.session) loginView(); });
</script></body></html>
