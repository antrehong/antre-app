<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ăn tré hong ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2742;--bg:#eef1f5;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;--ok:#059669;--warn:#d97706;--bad:#e11d48;--card:#fff;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit}
.shell{display:flex;min-height:100vh}
.side{width:230px;flex-shrink:0;background:var(--navy);color:#cbd5e1;padding:8px 0;overflow-y:auto}
.side h1{color:#fff;font-size:17px;margin:10px 16px 14px}
.side button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 16px;cursor:pointer}
.side button:hover{background:rgba(255,255,255,.08)}.side button.on{background:#059669;color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .sp{flex:1}
.content{padding:14px;flex:1}
h2{margin:0 0 12px;font-size:19px}h3{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.btn{background:var(--ok);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{filter:brightness(.95)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #cbd5e1}.btn.red{background:var(--bad)}.btn.amber{background:var(--warn)}.btn.sm{padding:4px 9px;font-size:12px}
input,select{border:1px solid #cbd5e1;border-radius:7px;padding:8px 10px;background:#fff;color:var(--ink);max-width:100%}
label{display:block;margin-bottom:10px;color:var(--mut);font-size:13px}label input,label select{display:block;width:100%;margin-top:4px;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.end{justify-content:flex-end}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-weight:500;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px 8px 0;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.badge{display:inline-block;padding:1px 8px;border-radius:5px;font-size:12px;white-space:nowrap}
.b-ok{background:#d1fae5;color:#065f46}.b-warn{background:#fef3c7;color:#92400e}.b-bad{background:#ffe4e6;color:#9f1239}.b-mut{background:#f1f5f9;color:#475569}.b-info{background:#e0f2fe;color:#075985}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.kpi b{display:block;font-size:20px;margin-top:2px}.kpi span{color:var(--mut);font-size:12px}
.pos{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;cursor:pointer;min-height:92px}
.tile:hover{border-color:var(--ok)}.tile:disabled{opacity:.45;cursor:not-allowed}.tile b{display:block;margin-bottom:4px}.tile span{color:var(--mut);font-size:12px}
.cart .ln{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #f1f5f9}
.cart .total{font-size:22px;font-weight:700;margin:8px 0}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:28px;height:28px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;cursor:pointer}
.warn{background:#fef3c7;color:#92400e;border-radius:8px;padding:10px 12px;margin-bottom:12px}
.empty{color:var(--mut);padding:24px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.box{background:#fff;border-radius:10px;padding:18px;width:100%;max-width:440px;max-height:100%;overflow:auto}
#toast{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:70;display:flex;flex-direction:column;gap:6px}
.t{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;max-width:320px;box-shadow:0 2px 8px rgba(0,0,0,.25)}.t.bad{background:var(--bad)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:14px}
.login form{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:360px}
.menu{display:none}
@media(max-width:820px){
 .side{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}
 .menu{display:inline-block}.pos{grid-template-columns:1fr}
}
.side .gh{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center}
.side .gh:hover{background:none;color:#e2e8f0}
.side .ng button:not(.gh){padding-left:26px}

.ag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:12px}
.ag{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card,#fff);position:relative;overflow:hidden}
.ag .hd{display:flex;align-items:center;gap:8px;font-weight:600}
.ag .dot{width:10px;height:10px;border-radius:50%;background:#94a3b8;flex:none}
.ag.run .dot{background:#3b82f6;animation:agp 1s infinite}.ag.ok .dot{background:#16a34a}.ag.warn .dot{background:#f59e0b}.ag.bad .dot{background:#dc2626}
.ag .bar{height:3px;background:var(--line);border-radius:3px;margin:8px 0;overflow:hidden}.ag .bar i{display:block;height:100%;width:0;background:#3b82f6}
.ag.run .bar i{animation:agb 1.1s ease-in-out infinite}.ag.ok .bar i,.ag.warn .bar i,.ag.bad .bar i{width:100%;animation:none}.ag.ok .bar i{background:#16a34a}.ag.warn .bar i{background:#f59e0b}.ag.bad .bar i{background:#dc2626}
.ag .sum{font-size:13px;color:var(--mut)}.ag ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.aglog{background:#0f172a;color:#cbd5e1;border-radius:10px;padding:10px 12px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;max-height:220px;overflow:auto}
.aglog .tm{color:#64748b}.aglog .w{color:#fbbf24}.aglog .b{color:#f87171}.aglog .o{color:#4ade80}
@keyframes agp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
@keyframes agb{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}

.lvbox{background:#0b1220;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.lvbox canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.lv-pop{font:700 19px system-ui,sans-serif;fill:#fde68a;paint-order:stroke;stroke:#0b1220;stroke-width:4px;animation:lvup 2.2s ease-out forwards}
.lv-pulse{fill:none;stroke:#38bdf8;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:lvpl 1s ease-out forwards}
.lv-bob{animation:lvbob 2.4s ease-in-out infinite}
.lvfeed{max-height:300px;overflow:auto;font-size:13px}.lvfeed div{padding:5px 0;border-bottom:1px solid var(--line)}
.lvwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}@media(max-width:900px){.lvwrap{grid-template-columns:1fr}}
@keyframes lvup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
@keyframes lvpl{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.4)}}
@keyframes lvbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style></head>
<body><div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============ CẤU HÌNH ============ */
const SB_URL = 'https://fouukklbtrrbrdzmlkfd.supabase.co';
const SB_KEY = 'sb_publishable__RArgZFOUSNg-OuF90VbIw_spkX93G2';   // khóa công khai; quyền thật nằm ở cơ sở dữ liệu
const sb = supabase.createClient(SB_URL, SB_KEY);

/* ============ TIỆN ÍCH ============ */
const h = (t, a, ...c) => {
  const e = document.createElement(t); let val;
  for (const [k, v] of Object.entries(a || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'value') val = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  c.flat(9).forEach(x => { if (x == null || x === false) return; e.append(x.nodeType ? x : document.createTextNode(String(x))); });
  if (val !== undefined) e.value = val;
  return e;
};
const fm = n => Math.round(+n || 0).toLocaleString('vi-VN') + 'đ';
const vnDate = (d = new Date()) => new Date(d).toLocaleDateString('en-CA', { timeZone: 'Asia/Ho_Chi_Minh' });
const addDays = n => vnDate(new Date(Date.now() + n * 864e5));
const vnTime = t => t ? new Date(t).toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour12: false }) : '';
const badge = (t, k = 'mut') => h('span', { class: 'badge b-' + k }, t);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random());
const ROLE_VI = { ADMIN: 'Quản trị', OPERATIONS_MANAGER: 'Quản lý vận hành', SALES_MANAGER: 'Quản lý kinh doanh', SALES: 'Kinh doanh', PRODUCTION: 'Sản xuất', WAREHOUSE: 'Kho', QC: 'QC', FINANCE: 'Tài chính', OUTLET_MANAGER: 'Quản lý điểm bán', OUTLET_STAFF: 'Nhân viên điểm bán' };
const q = async p => { const { data, error } = await p; if (error) throw error; return data; };
const rpc = (n, a) => q(sb.rpc(n, a));
const toast = (m, bad) => { const t = h('div', { class: 't' + (bad ? ' bad' : '') }, m); $('#toast').append(t); setTimeout(() => t.remove(), bad ? 6000 : 3500); };
const fail = e => { console.error(e); let m = (e && e.message) || String(e); if (/could not find the function|schema cache/i.test(m)) m = 'Chưa có hàm này trên Supabase — hãy chạy patch_06.sql trong SQL Editor rồi tải lại trang. (' + m + ')'; toast(m, true); };
const $ = (s, r = document) => r.querySelector(s);
const table = (cols, rows) => h('div', { class: 'sc' }, h('table', {}, h('thead', {}, h('tr', {}, cols.map(c => h('th', {}, c)))),
  h('tbody', {}, rows.length ? rows.map(r => h('tr', {}, r.map(c => h('td', {}, c)))) : h('tr', {}, h('td', { colspan: cols.length, class: 'empty' }, 'Chưa có dữ liệu')))));

function dialog(title, fields, okText = 'Lưu') {
  return new Promise(res => {
    const inputs = fields.map(f => {
      const lid = f.list ? 'dl' + Math.random().toString(36).slice(2) : null;
      const el = f.opts ? h('select', {}, f.opts.map(o => h('option', { value: o[0] }, o[1]))) : h('input', { type: f.type || 'text', placeholder: f.ph || '', value: f.val ?? '', step: f.type === 'number' ? 'any' : null, list: lid });
      if (lid) el._dl = h('datalist', { id: lid }, f.list.map(x => h('option', { value: x })));
      if (f.opts && f.val != null) el.value = f.val;
      return [f, el];
    });
    const close = v => { m.remove(); res(v); };
    const m = h('div', { class: 'modal', onclick: e => { if (e.target === m) close(null); } },
      h('div', { class: 'box' }, h('h3', {}, title), inputs.map(([f, el]) => h('label', {}, f.l, el, el._dl || null)),
        h('div', { class: 'row end' }, h('button', { class: 'btn ghost', onclick: () => close(null) }, 'Hủy'),
          h('button', { class: 'btn', onclick: () => { const o = {}; inputs.forEach(([f, el]) => o[f.k] = f.type === 'number' ? (el.value === '' ? null : +el.value) : el.value.trim ? el.value.trim() : el.value); close(o); } }, okText))));
    document.body.append(m); const first = m.querySelector('input,select'); if (first) first.focus();
  });
}
const confirmBox = msg => new Promise(res => {
  const close = v => { m.remove(); res(v); };
  const m = h('div', { class: 'modal' }, h('div', { class: 'box' }, h('p', {}, msg), h('div', { class: 'row end' },
    h('button', { class: 'btn ghost', onclick: () => close(false) }, 'Hủy'), h('button', { class: 'btn', onclick: () => close(true) }, 'Đồng ý'))));
  document.body.append(m);
});

/* ============ TRẠNG THÁI & QUYỀN ============ */
const S = { prof: null, outlets: [], mine: [], oid: null, mod: null, products: [], notifs: [] };
const role = () => S.prof.role;
const is = (...r) => r.includes(role());
const stores = () => S.outlets.filter(o => o.kind === 'store' && o.active !== false);
const oname = id => (S.outlets.find(o => o.id === id) || {}).name || '—';
const pname = id => (S.products.find(p => p.id === id) || {}).name || id;
const MODS = [
  ['dash',  'Tổng quan điều hành', ['ADMIN', 'OPERATIONS_MANAGER', 'SALES_MANAGER', 'FINANCE', 'OUTLET_MANAGER']],
  ['pos',   'Bán hàng',           ['ADMIN', 'OPERATIONS_MANAGER', 'OUTLET_MANAGER', 'OUTLET_STAFF']],
  ['sales', 'Hóa đơn bán lẻ',     ['ADMIN', 'OPERATIONS_MANAGER', 'SALES_MANAGER', 'FINANCE', 'OUTLET_MANAGER', 'OUTLET_STAFF']],
  ['shift', 'Ca bán & chốt ca',   ['ADMIN', 'OPERATIONS_MANAGER', 'OUTLET_MANAGER', 'OUTLET_STAFF']],
  ['stock', 'Tồn kho thành phẩm', ['ADMIN', 'OPERATIONS_MANAGER', 'PRODUCTION', 'WAREHOUSE', 'QC', 'OUTLET_MANAGER', 'OUTLET_STAFF']],
  ['recv',  'Chuyển & nhận kho',  ['ADMIN', 'OPERATIONS_MANAGER', 'WAREHOUSE', 'OUTLET_MANAGER', 'OUTLET_STAFF']],
  ['menu',  'Quản lý thực đơn',   ['ADMIN', 'OPERATIONS_MANAGER', 'SALES_MANAGER', 'FINANCE']],
  ['batch', 'Sản xuất & QC',      ['ADMIN', 'OPERATIONS_MANAGER', 'PRODUCTION', 'QC']],
  ['mat',   'Kho nguyên liệu',    ['ADMIN', 'OPERATIONS_MANAGER', 'PRODUCTION', 'WAREHOUSE']],
  ['recipe','Công thức & giá vốn', ['ADMIN', 'OPERATIONS_MANAGER', 'PRODUCTION', 'FINANCE']],
  ['omat',  'Nguyên liệu tại điểm bán', ['ADMIN', 'OPERATIONS_MANAGER', 'WAREHOUSE', 'PRODUCTION', 'FINANCE', 'OUTLET_MANAGER', 'OUTLET_STAFF']],
  ['agent', 'Trợ lý giám sát',    ['ADMIN']],
  ['imp',   'Nhập / xuất file mẫu', ['ADMIN', 'OPERATIONS_MANAGER']],
  ['live',  'Bản đồ hoạt động',   ['ADMIN', 'OPERATIONS_MANAGER']],
  ['po',    'Mua hàng & NCC',     ['ADMIN', 'OPERATIONS_MANAGER', 'FINANCE']],
  ['orders','Đơn hàng B2B',       ['ADMIN', 'OPERATIONS_MANAGER', 'SALES_MANAGER', 'SALES', 'PRODUCTION', 'WAREHOUSE', 'QC', 'FINANCE']],
  ['deliv', 'Điều phối giao hàng', ['ADMIN', 'OPERATIONS_MANAGER', 'WAREHOUSE', 'SALES_MANAGER']],
  ['cust',  'Khách hàng & công nợ', ['ADMIN', 'OPERATIONS_MANAGER', 'SALES_MANAGER', 'SALES', 'FINANCE']],
  ['trade', 'Trade marketing',    ['ADMIN', 'OPERATIONS_MANAGER', 'SALES_MANAGER']],
  ['tasks', 'Công việc & SOP',    ['ADMIN']],
  ['rep',   'Báo cáo xuất file',  ['ADMIN', 'OPERATIONS_MANAGER', 'FINANCE']],
  ['admin', 'Quản trị dữ liệu',    ['ADMIN']],
  ['audit', 'Nhật ký thao tác',   ['ADMIN']]
];
const allowed = () => MODS.filter(m => m[2].includes(role()));
// Menu gom theo nhóm chức năng. Mục chưa xếp nhóm sẽ rơi vào nhóm "Khác"; nhóm không có mục nào cho vai trò hiện tại sẽ tự ẩn.
const GROUPS = [
  ['1 · Theo dõi bán hàng',        ['dash', 'pos', 'sales', 'shift', 'stock', 'recv']],
  ['2 · Làm thành phẩm',           ['po', 'mat', 'omat', 'recipe', 'batch', 'menu']],
  ['3 · Bán hàng B2B',             ['orders', 'deliv', 'cust']],
  ['4 · Công việc & Marketing',    ['tasks', 'trade']],
  ['5 · Quản trị',                 ['live', 'agent', 'imp', 'rep', 'admin', 'audit']]
];
const needsOutlet = m => ['pos', 'shift', 'recv'].includes(m);

/* ============ KHUNG ỨNG DỤNG ============ */
const app = $('#app');
function loginView(msg) {
  let show = false;
  const em = h('input', { type: 'email', autocomplete: 'username', placeholder: 'email@antrehong.vn' });
  const pw = h('input', { type: 'password', autocomplete: 'current-password' });
  const err = h('div', { style: 'color:var(--bad);margin:8px 0' }, msg || '');
  const btn = h('button', { class: 'btn', style: 'width:100%' }, 'Đăng nhập');
  const f = h('form', { onsubmit: async e => {
    e.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Đang đăng nhập…';
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    btn.disabled = false; btn.textContent = 'Đăng nhập';
    if (error) err.textContent = error.message === 'Invalid login credentials' ? 'Sai email hoặc mật khẩu.' : error.message;
  } },
    h('h2', {}, 'Ăn tré hong ERP'), h('div', { style: 'color:var(--mut);margin:-6px 0 14px' }, 'Đăng nhập bằng tài khoản được cấp'),
    h('label', {}, 'Email', em),
    h('label', {}, 'Mật khẩu', h('div', { class: 'row', style: 'flex-wrap:nowrap' }, pw,
      h('button', { type: 'button', class: 'btn ghost sm', onclick: () => { show = !show; pw.type = show ? 'text' : 'password'; } }, 'Hiện/Ẩn'))),
    err, btn,
    h('div', { style: 'margin-top:10px;text-align:center' }, h('a', { href: '#', onclick: async e => {
      e.preventDefault(); if (!em.value) { err.textContent = 'Nhập email trước.'; return; }
      const { error } = await sb.auth.resetPasswordForEmail(em.value.trim(), { redirectTo: location.href.split('#')[0] });
      err.style.color = error ? 'var(--bad)' : 'var(--ok)'; err.textContent = error ? error.message : 'Đã gửi email đặt lại mật khẩu (nếu tài khoản tồn tại).';
    } }, 'Quên mật khẩu?')));
  app.replaceChildren(h('div', { class: 'login' }, f));
}

async function boot(user) {
  try {
    const prof = await q(sb.from('profiles').select('*').eq('id', user.id).maybeSingle());
    if (!prof || prof.status !== 'Active') { await sb.auth.signOut(); return loginView('Tài khoản chưa được kích hoạt hoặc đã bị khóa.'); }
    S.prof = prof;
    const [outs, mine] = await Promise.all([q(sb.from('outlets').select('*').order('code')), q(sb.from('user_outlets').select('outlet_id'))]);
    await loadProducts(); S.outlets = outs; S.mine = mine.map(x => x.outlet_id);
    const st = stores(); S.oid = (st.find(o => S.mine.includes(o.id)) || st[0] || {}).id || null;
    S.mod = (allowed()[0] || [])[0] || null;
    await loadNotifs(); S._nr = true; shell(); subscribe(); go(S.mod);
  } catch (e) { fail(e); loginView('Không tải được dữ liệu: ' + e.message); }
}

function shell() {
  let navOpen = {}; try { navOpen = JSON.parse(localStorage.getItem('navopen') || '{}'); } catch (e) {}
  const grouped = new Set(GROUPS.flatMap(g => g[1]));
  const groups = GROUPS.concat([['Khác', allowed().map(m => m[0]).filter(id => !grouped.has(id))]]);
  const nav = groups.map(([gname, ids]) => {
    const ms = allowed().filter(m => ids.includes(m[0])); if (!ms.length) return null;
    const isOpen = navOpen[gname] === true || ms.some(m => m[0] === S.mod); const arrow = h('span', {}, isOpen ? '▾' : '▸');
    const body = h('div', { style: isOpen ? '' : 'display:none' }, ms.map(m => h('button', { 'data-m': m[0], onclick: () => { side.classList.remove('open'); go(m[0]); } }, m[1])));
    const head = h('button', { class: 'gh', onclick: () => {
      const hide = body.style.display !== 'none'; body.style.display = hide ? 'none' : ''; arrow.textContent = hide ? '▸' : '▾';
      navOpen[gname] = !hide; try { localStorage.setItem('navopen', JSON.stringify(navOpen)); } catch (e) {} } }, h('span', {}, gname), arrow);
    return h('div', { class: 'ng', 'data-g': ms.map(m => m[0]).join(',') }, head, body);
  });
  const side = h('div', { class: 'side' }, h('h1', {}, 'Ăn tré hong ERP'), nav);
  const sel = h('select', { id: 'osel', onchange: e => { S.oid = e.target.value; go(S.mod); } },
    S.outlets.filter(o => o.active !== false && (o.kind === 'store' || is('ADMIN', 'OPERATIONS_MANAGER', 'WAREHOUSE', 'PRODUCTION', 'QC'))).map(o => h('option', { value: o.id }, o.name)));

          isAdmin ? h('button', { class: 'btn red sm', disabled: !(u && u.o_can_delete), title: u && u.o_can_delete ? 'Xóa vĩnh viễn' : 'Đã có lịch sử giao dịch — chỉ có thể ẩn', onclick: () => del(p) }, 'Xóa') : null] : null)];
    }))));
}

/* ---- Hóa đơn bán lẻ / đơn B2B: xóa dữ liệu sai hoặc dữ liệu thử ---- */
function purgeSaleBtn(r) {
  return h('button', { class: 'btn red sm', onclick: async () => {
    const v = await reasonDlg('Xóa hóa đơn ' + r.code + ' (' + fm(r.total) + ')'); if (!v) return;
    try { await rpc('purge_retail_sale', { p_sale: r.id, p_reason: v.r, p_allow_closed: false }); }
    catch (e) {
      if (!/ca đã chốt/.test(e.message)) return fail(e);
      if (!await confirmBox('Hóa đơn này thuộc ca đã chốt. Vẫn xóa và tính lại tiền kỳ vọng của ca?')) return;
      try { await rpc('purge_retail_sale', { p_sale: r.id, p_reason: v.r, p_allow_closed: true }); } catch (e2) { return fail(e2); }
    }
    toast('Đã xóa ' + r.code + ' — tồn kho được hoàn lại'); go('sales');
  } }, 'Xóa');
}
function purgeOrderBtn(r) {
  return h('button', { class: 'btn red sm', onclick: async () => {
    const v = await reasonDlg('Xóa đơn ' + r.code + ' (' + r.status + ')'); if (!v) return;
    try { await rpc('purge_b2b_order', { p_order: r.id, p_reason: v.r, p_reverse: false }); }

  } }, 'Xóa');
}

/* ---- Màn hình Quản trị dữ liệu ---- */
function staffDialog(p, ids) {
  return new Promise(res => {
    const name = h('input', { value: p.full_name || '' }), role = h('select', {}, Object.keys(ROLE_VI).map(r => h('option', { value: r }, ROLE_VI[r] + ' — ' + r)));

    role.value = p.role; status.value = p.status;

      h('label', {}, 'Họ tên', name), h('label', {}, 'Vai trò', role), h('label', {}, 'Trạng thái', status),

      h('div', { class: 'row end', style: 'margin-top:12px' }, h('button', { class: 'btn ghost', onclick: () => close(null) }, 'Hủy'),
        h('button', { class: 'btn', onclick: () => close({ name: name.value.trim(), role: role.value, status: status.value, outlets: S.outlets.filter((o, i) => boxes[i].checked).map(o => o.id) }) }, 'Lưu'))));
    document.body.append(m);
  });
}
async function adminView() {
  await loadOutlets();
  const [profs, uo] = await Promise.all([q(sb.from('profiles').select('id,email,full_name,role,status').order('email')), q(sb.from('user_outlets').select('user_id,outlet_id'))]);
  const reshell = async () => { shell(); await go('admin'); };

  /* 1. Điểm bán */
  const addOutlet = async () => {
    const v = await dialog('Thêm điểm bán', [{ k: 'code', l: 'Mã điểm (chữ HOA, số, -; không đổi được; nằm trong số hóa đơn)', ph: 'VD: Q3' }, { k: 'name', l: 'Tên điểm bán' }, { k: 'kind', l: 'Loại', opts: [['store', 'Điểm bán'], ['warehouse', 'Kho']] }, { k: 'address', l: 'Địa chỉ' }], 'Thêm'); if (!v) return;
    const code = (v.code || '').toUpperCase();
    if (!/^[A-Z0-9-]{2,12}$/.test(code) || !v.name) return toast('Mã điểm 2–12 ký tự (A-Z, 0-9, -) và cần nhập tên', true);
    try { await q(sb.from('outlets').insert({ code, name: v.name, kind: v.kind, address: v.address || null })); toast('Đã thêm điểm bán'); await reshell(); } catch (e) { fail(e); }
  };
  const editOutlet = async o => {
    const v = await dialog('Sửa điểm bán ' + o.code, [{ k: 'name', l: 'Tên', val: o.name }, { k: 'address', l: 'Địa chỉ', val: o.address }]); if (!v || !v.name) return;
    try { await mut(sb.from('outlets').update({ name: v.name, address: v.address || null }).eq('id', o.id)); await reshell(); } catch (e) { fail(e); }
  };
  const outletsCard = h('div', { class: 'card' }, h('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:8px' }, h('h3', { style: 'margin:0' }, 'Điểm bán & kho'), h('button', { class: 'btn', onclick: addOutlet }, '+ Thêm điểm bán')),
    table(['Mã', 'Tên', 'Loại', 'Địa chỉ', 'Trạng thái', ''], S.outlets.map(o => [o.code, h('b', {}, o.name), o.kind === 'store' ? 'Điểm bán' : 'Kho', o.address || '', o.active === false ? badge('Đã tắt', 'mut') : badge('Hoạt động', 'ok'),
      h('div', { class: 'row' }, h('button', { class: 'btn ghost sm', onclick: () => editOutlet(o) }, 'Sửa'),
        h('button', { class: 'btn amber sm', onclick: async () => { const on = o.active !== false; if (!await confirmBox((on ? 'Tắt' : 'Bật lại') + ' "' + o.name + '"? ' + (on ? 'Không bán hay chuyển hàng tới điểm này nữa; lịch sử giữ nguyên.' : ''))) return; try { await mut(sb.from('outlets').update({ active: !on }).eq('id', o.id)); await reshell(); } catch (e) { fail(e); } } }, o.active === false ? 'Bật' : 'Tắt'),
        h('button', { class: 'btn red sm', onclick: async () => { if (!await confirmBox('Xóa vĩnh viễn "' + o.name + '"? Chỉ xóa được khi chưa có ca bán, hóa đơn, sổ kho hay phiếu chuyển.')) return; try { await rpc('delete_outlet', { p_id: o.id }); toast('Đã xóa'); await reshell(); } catch (e) { fail(e); } } }, 'Xóa'))])));

  /* 2. Nhân sự & phân quyền */
  const staffCard = h('div', { class: 'card' }, h('h3', {}, 'Nhân sự & phân quyền'),
    h('div', { style: 'color:var(--mut);font-size:13px;margin-bottom:8px' }, 'Tài khoản đăng nhập mới được tạo ở Supabase → Authentication → Users (tích Auto Confirm User). Sau đó chỉnh vai trò và điểm bán tại đây.'),
    table(['Email', 'Họ tên', 'Vai trò', 'Trạng thái', 'Điểm bán', ''], profs.map(p => { const ids = uo.filter(x => x.user_id === p.id).map(x => x.outlet_id);
      return [p.email, p.full_name || '', badge(ROLE_VI[p.role] || p.role, 'info'), p.status === 'Active' ? badge('Hoạt động', 'ok') : badge('Khóa', 'bad'), ids.map(oname).join(', ') || '—',
        h('button', { class: 'btn ghost sm', onclick: async () => { const v = await staffDialog(p, ids); if (!v) return; try { await rpc('set_user_access', { p_user: p.id, p_name: v.name, p_role: v.role, p_status: v.status, p_outlets: v.outlets }); toast('Đã lưu phân quyền'); await reshell(); } catch (e) { fail(e); } } }, 'Sửa quyền')]; })));

  /* 3. Xóa dữ liệu bán lẻ theo khoảng */
  const from = h('input', { type: 'date', value: vnDate() }), to = h('input', { type: 'date', value: vnDate() });
  const osel = h('select', {}, h('option', { value: '' }, 'Tất cả điểm bán'), S.outlets.filter(o => o.kind === 'store').map(o => h('option', { value: o.id }, o.name + (o.active === false ? ' (đã tắt)' : ''))));
  const info = h('div', { style: 'margin:8px 0;color:var(--mut)' });
  const preview = async () => {
    let qy = sb.from('retail_sales').select('id,total,status'); if (osel.value) qy = qy.eq('outlet_id', osel.value);
    const rows = await q(qy.gte('sold_at', from.value + 'T00:00:00+07:00').lte('sold_at', to.value + 'T23:59:59+07:00').range(0, 4999));
    info.textContent = rows.length + ' hóa đơn, tổng ' + fm(rows.reduce((a, r) => a + +r.total, 0)); return rows;
  };
  const purge = async () => {
    const rows = await preview(); if (!rows.length) return toast('Không có hóa đơn nào trong khoảng này', true);
    const v = await dialog('Xóa ' + rows.length + ' hóa đơn bán lẻ', [{ k: 'r', l: 'Lý do (bắt buộc)' }, { k: 'c', l: 'Gõ XOA để xác nhận' }, { k: 'a', l: 'Hóa đơn thuộc ca đã chốt', opts: [['false', 'Bỏ qua (an toàn)'], ['true', 'Xóa luôn và tính lại ca']] }], 'Xóa vĩnh viễn'); if (!v) return;
    if (v.c !== 'XOA') return toast('Chưa gõ đúng XOA — không xóa gì', true);
    try { const r = await rpc('purge_retail_range', { p_outlet: osel.value || null, p_from: from.value, p_to: to.value, p_reason: v.r, p_allow_closed: v.a === 'true' });
      toast('Đã xóa ' + r.deleted + ' hóa đơn' + (r.skipped ? ', bỏ qua ' + r.skipped + ' hóa đơn của ca đã chốt' : '') + '. Tồn kho đã được hoàn lại.'); info.textContent = ''; } catch (e) { fail(e); }
  };
  const purgeCard = h('div', { class: 'card' }, h('h3', {}, 'Dọn dữ liệu bán lẻ sai / dữ liệu thử'),
    h('div', { style: 'color:var(--mut);font-size:13px;margin-bottom:8px' }, 'Hóa đơn bị xóa kéo theo các dòng xuất kho của chính nó, nên tồn kho trở lại như chưa bán. Mọi lần xóa đều ghi vào Nhật ký thao tác. Muốn xóa từng hóa đơn: vào "Hóa đơn bán lẻ".'),
    h('div', { class: 'row' }, osel, h('label', { style: 'margin:0' }, 'Từ ', from), h('label', { style: 'margin:0' }, 'Đến ', to), h('button', { class: 'btn ghost', onclick: () => preview().catch(fail) }, 'Xem trước'), h('button', { class: 'btn red', onclick: () => purge().catch(fail) }, 'Xóa các hóa đơn này')), info);

  /* 4. Đưa dữ liệu về ban đầu */
  const reset = async (scope, label, detail) => {
    const need = 'XOA-' + scope.toUpperCase();
    const v = await dialog(label, [{ k: 'r', l: 'Lý do (bắt buộc)' }, { k: 'c', l: 'Gõ chính xác ' + need + ' để xác nhận' }], 'Xóa vĩnh viễn'); if (!v) return;
    if (v.c !== need) return toast('Chưa gõ đúng ' + need + ' — không xóa gì', true);
    try { const r = await rpc('reset_data', { p_scope: scope, p_confirm: v.c, p_reason: v.r }); toast('Đã đưa dữ liệu về ban đầu: ' + r.retail_sales + ' hóa đơn, ' + r.orders + ' đơn B2B, ' + r.batches + ' lô đã xóa'); await reshell(); } catch (e) { fail(e); }
  };
  const resetCard = h('div', { class: 'card' }, h('h3', {}, 'Đưa dữ liệu về trạng thái ban đầu'),
    h('div', { class: 'warn' }, 'Không hoàn tác được. Hãy vào "Báo cáo xuất file" tải CSV trước. Giữ lại: món, giá, công thức, danh sách nguyên liệu, khách hàng, nhà cung cấp, điểm bán, tài khoản.'),
    h('div', { class: 'row' },
      h('button', { class: 'btn red', onclick: () => reset('retail', 'Xóa TOÀN BỘ hóa đơn bán lẻ và ca bán') }, 'Xóa toàn bộ dữ liệu bán lẻ'),
      h('button', { class: 'btn red', onclick: () => reset('b2b', 'Xóa TOÀN BỘ đơn B2B (dư nợ khách về 0)') }, 'Xóa toàn bộ đơn B2B & công nợ'),
      h('button', { class: 'btn red', onclick: () => reset('all', 'Xóa TOÀN BỘ dữ liệu giao dịch (bán lẻ, B2B, lô, tồn kho, kho nguyên liệu)') }, 'Xóa tất cả dữ liệu giao dịch')));
  return h('div', {}, purgeCard, outletsCard, staffCard, resetCard);
}

/* ---- Cảnh báo: nguyên liệu / bao bì không còn đủ làm X phần mỗi món ---- */
async function capacityBanner() {
  if (!is('ADMIN', 'OPERATIONS_MANAGER', 'PRODUCTION', 'WAREHOUSE')) return null;
  const [cap, mats, st] = await Promise.all([safe(rpc('product_capacity')), safe(q(sb.from('materials').select('id,name,unit,min_stock').eq('active', true))), safe(q(sb.from('material_stock').select('*')))]);
  const stock = id => +((st.find(s => s.material_id === id) || {}).qty || 0);
  const lowP = cap.filter(c => c.o_low), lowM = mats.filter(m => +m.min_stock > 0 && stock(m.id) <= +m.min_stock);
  if (!lowP.length && !lowM.length) return null;
  return h('div', { class: 'warn' }, h('b', {}, 'Cảnh báo: nguyên liệu / bao bì sắp hết'),
    lowP.map(c => h('div', {}, 'Món "' + c.o_name + '" chỉ còn đủ làm ' + c.o_capacity + ' phần (ngưỡng ' + c.o_min + ') — thiếu nhất: ' + c.o_limit_material)),
    lowM.map(m => h('div', {}, '"' + m.name + '" còn ' + stock(m.id) + ' ' + m.unit + ' (tối thiểu ' + m.min_stock + ' ' + m.unit + ')')));
}
async function capacityCard(canEdit) {
  const cap = await safe(rpc('product_capacity')); if (!cap.length) return null;
  const setOne = async c => {
    const v = await dialog('Ngưỡng cảnh báo — ' + c.o_name, [{ k: 'm', l: 'Báo khi nguyên liệu/bao bì chỉ còn đủ làm dưới … phần (0 = tắt cảnh báo)', type: 'number', val: c.o_min }]); if (!v || v.m == null) return;
    try { await rpc('set_min_portions', { p_product: c.o_product, p_min: v.m }); toast('Đã lưu ngưỡng'); go('mat'); } catch (e) { fail(e); }
  };
  const setAll = async () => {
    const v = await dialog('Đặt chung một ngưỡng cho mọi món đang bán', [{ k: 'm', l: 'Báo khi chỉ còn đủ làm dưới … phần (0 = tắt)', type: 'number', val: 50 }]); if (!v || v.m == null) return;
    try { const n = await rpc('set_all_min_portions', { p_min: v.m }); toast('Đã đặt ngưỡng ' + v.m + ' phần cho ' + n + ' món'); go('mat'); } catch (e) { fail(e); }
  };
  return h('div', { class: 'card' }, h('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:8px' }, h('h3', { style: 'margin:0' }, 'Khả năng sản xuất theo món'),
    canEdit ? h('button', { class: 'btn ghost', onclick: setAll }, 'Đặt chung một ngưỡng cho mọi món') : null),
    table(['Món', 'Đủ làm được', 'Ngưỡng cảnh báo', 'Thiếu nhất', 'Trạng thái', ''], cap.map(c => [h('b', {}, c.o_name), c.o_capacity == null ? '—' : c.o_capacity + ' phần', c.o_min > 0 ? 'dưới ' + c.o_min + ' phần' : 'tắt',
      c.o_limit_material ? c.o_limit_material + ' (còn ' + (+c.o_limit_stock).toFixed(2) + ' ' + c.o_limit_unit + ')' : '—',
      c.o_capacity == null ? badge('Chưa có công thức', 'warn') : c.o_low ? badge('Sắp thiếu', 'bad') : badge('Đủ', 'ok'),
      canEdit ? h('button', { class: 'btn ghost sm', onclick: () => setOne(c) }, 'Đặt ngưỡng') : null])));
}
